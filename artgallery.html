<!DOCTYPE html>
<html lang="ta">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>மாணவர் கலைக் கண்காட்சி</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Styling for the Home Button */
        .home-button {
            display: inline-block;
            background-color: #333333;
            color: #ffffff;
            padding: 10px 18px;
            margin-bottom: 15px;
            text-decoration: none;
            border-radius: 6px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .home-button:hover {
            background-color: #555555;
        }

        .home-button:active {
            transform: scale(0.98);
        }

        /* Basic header layout */
        .gallery-header {
            text-align: center;
            padding: 20px;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="gallery-header">
        <!-- Home Button Added Here -->
        <a href="index.html" class="home-button">← முகப்புக்குத் திரும்பு</a>
        
        <h1>மாணவர் கலைக் கண்காட்சி</h1>
        <p>நமது திறமையான மாணவர்களின் படைப்பாற்றலைக் கொண்டாடுகிறோம்.</p>
    </div>

    <div class="art-gallery" id="gallery-container">
        <p id="loading-msg" style="text-align:center; width:100%; grid-column: 1 / -1;">
            கண்காட்சியைத் தயார் செய்கிறது... கலைப்படைப்புகளை ஏற்றுகிறது...
        </p>
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img class="lightbox-content" id="expanded-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
