<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team Swipe Scoreboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; /* Prevent text selection while swiping */
            -webkit-tap-highlight-color: transparent; /* Remove mobile tap highlight */
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #222;
            touch-action: none; /* Prevents default browser actions like pinch-zoom */
        }

        /* Container: Flexbox handles layout and sorting */
        #split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* 
           Orientation logic: 
           Portrait = vertical stripes (winners on top)
           Landscape = horizontal stripes (winners on left)
        */
        @media (orientation: portrait) {
            #split-container { flex-direction: column; }
        }
        @media (orientation: landscape) {
            #split-container { flex-direction: row; }
        }

        .split-part {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
            /* Flex order is handled by JS for sorting */
        }

        /* Floating UI Panel */
        #ui-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 95%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* Completely hides the UI */
        .hidden {
            display: none !important;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .control-group {
            margin-bottom: 15px;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .settings-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ccc;
        }

        select, button {
            width: 100%;
            padding: 8px;
            font-size: 1rem;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        button {
            background-color: #2196f3;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            padding: 12px;
        }

        button:active { filter: brightness(0.9); }
        
        #hide-ui-btn { background-color: #ff4c4c; }
        #reset-btn { background-color: #ff9800; }

        /* Color classes */
        .color-red { background-color: #ff4c4c; }
        .color-yellow { background-color: #ffd700; }
        .color-green { background-color: #4caf50; }
        .color-blue { background-color: #2196f3; }
        .color-white { background-color: #ffffff; }

    </style>
</head>
<body>

    <!-- Colored areas -->
    <div id="split-container"></div>

    <!-- UI Panel -->
    <div id="ui-panel">
        <h2>Settings (Double Tap background to show)</h2>

        <div class="control-group">
            <label for="parts-select">Total Teams / Splits:</label>
            <select id="parts-select">
                <option value="2">2 Parts</option>
                <option value="3">3 Parts</option>
                <option value="4">4 Parts</option>
                <option value="5" selected>5 Parts</option>
            </select>
        </div>

        <div id="dynamic-settings"></div>

        <button id="reset-btn">Reset All Scores to Zero</button>
        <button id="hide-ui-btn">Hide Menu & Play</button>
    </div>

    <script>
        // --- Game State ---
        let numSplits = 5;
        let partsData = []; // Holds state for each individual house/part

        const availableColors = [
            { class: 'color-red', label: 'Red', textCol: '#ffffff' },
            { class: 'color-yellow', label: 'Yellow', textCol: '#000000' },
            { class: 'color-green', label: 'Green', textCol: '#ffffff' },
            { class: 'color-blue', label: 'Blue', textCol: '#ffffff' },
            { class: 'color-white', label: 'White', textCol: '#000000' }
        ];
        
        const pointOptions = [1, 2, 5, 10, 20, 50, 100];

        // --- DOM Elements ---
        const splitContainer = document.getElementById('split-container');
        const partsSelect = document.getElementById('parts-select');
        const dynamicSettings = document.getElementById('dynamic-settings');
        const resetBtn = document.getElementById('reset-btn');
        const hideUiBtn = document.getElementById('hide-ui-btn');
        const uiPanel = document.getElementById('ui-panel');

        // --- Core Functions ---

        // Initialize or update the state array based on selected number of splits
        function initData() {
            const oldData = [...partsData];
            partsData = [];
            for (let i = 0; i < numSplits; i++) {
                // Preserve score and settings if changing number of parts, otherwise default
                if (oldData[i]) {
                    partsData.push(oldData[i]);
                } else {
                    partsData.push({
                        id: i,
                        score: 0,
                        colorClass: availableColors[i % availableColors.length].class,
                        points: 5 // Default swipe multiplier
                    });
                }
            }
        }

        // Build Settings Dropdowns
        function buildSettings() {
            dynamicSettings.innerHTML = ''; 
            
            partsData.forEach((part, index) => {
                const group = document.createElement('div');
                group.classList.add('control-group');
                
                const label = document.createElement('label');
                label.textContent = `House ${index + 1} Settings:`;
                group.appendChild(label);

                const row = document.createElement('div');
                row.classList.add('settings-row');

                // Color Setup
                const colorSelect = document.createElement('select');
                availableColors.forEach(color => {
                    const opt = document.createElement('option');
                    opt.value = color.class;
                    opt.textContent = color.label;
                    if (color.class === part.colorClass) opt.selected = true;
                    colorSelect.appendChild(opt);
                });
                
                colorSelect.addEventListener('change', (e) => {
                    part.colorClass = e.target.value;
                    renderGameView();
                });

                // Points Setup
                const pointsSelect = document.createElement('select');
                pointOptions.forEach(pts => {
                    const opt = document.createElement('option');
                    opt.value = pts;
                    opt.textContent = `${pts} Points`;
                    if (pts === part.points) opt.selected = true;
                    pointsSelect.appendChild(opt);
                });

                pointsSelect.addEventListener('change', (e) => {
                    part.points = parseInt(e.target.value);
                });

                row.appendChild(colorSelect);
                row.appendChild(pointsSelect);
                group.appendChild(row);
                dynamicSettings.appendChild(group);
            });
        }

        // Create the game display based on current data
        function renderGameView() {
            splitContainer.innerHTML = ''; 
            
            // Sort a copy of the data to calculate ranks (highest score first)
            const ranked = [...partsData].sort((a, b) => b.score - a.score);

            partsData.forEach(part => {
                const div = document.createElement('div');
                div.classList.add('split-part', part.colorClass);
                div.dataset.id = part.id;
                
                // Set the score text
                div.textContent = part.score;
                
                // Determine contrasting text color based on background
                const colorObj = availableColors.find(c => c.class === part.colorClass);
                div.style.color = colorObj ? colorObj.textCol : '#000';
                
                // Calculate Flexbox Order (Places highest scores at top/left)
                const rankIndex = ranked.findIndex(r => r.id === part.id);
                div.style.order = rankIndex;

                splitContainer.appendChild(div);
            });
        }

        // --- Event Listeners for UI ---
        partsSelect.addEventListener('change', (e) => {
            numSplits = parseInt(e.target.value);
            initData();
            buildSettings();
            renderGameView();
        });

        resetBtn.addEventListener('click', () => {
            partsData.forEach(part => part.score = 0);
            renderGameView();
        });

        hideUiBtn.addEventListener('click', () => {
            uiPanel.classList.add('hidden'); // Completely removes the menu
        });

        // --- Swipe & Double Tap Logic ---
        let touchstartX = 0;
        let touchstartY = 0;
        let lastTapTime = 0;

        splitContainer.addEventListener('touchstart', (e) => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, { passive: false });

        splitContainer.addEventListener('touchend', (e) => {
            const touchendX = e.changedTouches[0].screenX;
            const touchendY = e.changedTouches[0].screenY;
            
            const distanceX = Math.abs(touchendX - touchstartX);
            const distanceY = Math.abs(touchendY - touchstartY);
            
            const isSwipe = (distanceX > 30 || distanceY > 30);
            
            if (isSwipe) {
                // Handle Swipe: Add points
                const targetPart = e.target.closest('.split-part');
                if (targetPart && uiPanel.classList.contains('hidden')) {
                    const id = parseInt(targetPart.dataset.id);
                    const partData = partsData.find(p => p.id === id);
                    if (partData) {
                        partData.score += partData.points;
                        renderGameView(); // Re-render to update scores and sort order
                    }
                }
            } else {
                // Handle Tap: Check for Double Tap to show menu
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                
                // If tapped twice within 300 milliseconds
                if (tapLength < 300 && tapLength > 0) {
                    uiPanel.classList.remove('hidden');
                    e.preventDefault();
                }
                lastTapTime = currentTime;
            }
        }, { passive: false });

        // --- Boot Sequence ---
        initData();
        buildSettings();
        renderGameView();
    </script>
</body>
</html>
