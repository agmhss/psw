<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Swipe Scoreboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        body, html {
            height: 100%;
            overflow: hidden; 
            background-color: #222;
            touch-action: pan-x pan-y; 
        }

        /* Container */
        #split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            cursor: pointer; /* Gives a hand icon on laptops to indicate it's clickable */
        }

        /* Automatic Layout */
        @media screen and (orientation: portrait) {
            #split-container:not(.force-row) { flex-direction: column; }
        }
        @media screen and (orientation: landscape) {
            #split-container:not(.force-col) { flex-direction: row; }
        }

        /* Manual Layout Overrides */
        #split-container.force-col { flex-direction: column !important; }
        #split-container.force-row { flex-direction: row !important; }

        .split-part {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem; 
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        /* Floating UI Panel */
        #ui-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            width: 95%;
            max-width: 500px;
            max-height: 95vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h2 {
            font-size: 1.8rem; 
            margin-bottom: 20px;
            color: #fff;
        }

        .control-group {
            margin-bottom: 20px;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
        }

        .settings-row {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.2rem; 
            font-weight: bold;
            color: #eee;
        }

        select, button {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem; 
            border-radius: 8px;
            border: none;
            outline: none;
            background-color: #fff;
            color: #333;
            cursor: pointer;
        }

        button {
            background-color: #2196f3;
            color: white;
            font-weight: bold;
            margin-top: 15px;
            padding: 16px;
            font-size: 1.3rem;
        }

        button:active { filter: brightness(0.9); }
        
        #hide-ui-btn { background-color: #ff4c4c; }
        #reset-btn { background-color: #ff9800; }

        /* Color classes */
        .color-red { background-color: #ff4c4c; }
        .color-yellow { background-color: #ffd700; }
        .color-green { background-color: #4caf50; }
        .color-blue { background-color: #2196f3; }
        .color-white { background-color: #ffffff; }

    </style>
</head>
<body>

    <div id="split-container"></div>

    <div id="ui-panel">
        <h2>Settings <br><span style="font-size: 1rem; color: #ccc;">(Double Tap / Double Click to show)</span></h2>

        <div class="control-group">
            <label for="layout-select">Layout Style:</label>
            <select id="layout-select">
                <option value="auto">Auto (Depends on Screen Ratio)</option>
                <option value="horizontal">Force Horizontal (Left to Right)</option>
                <option value="vertical">Force Vertical (Top to Bottom)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="parts-select">Total Teams / Splits:</label>
            <select id="parts-select">
                <option value="2">2 Teams</option>
                <option value="3">3 Teams</option>
                <option value="4">4 Teams</option>
                <option value="5" selected>5 Teams</option>
            </select>
        </div>

        <div id="dynamic-settings"></div>

        <button id="reset-btn">Reset All Scores to Zero</button>
        <button id="hide-ui-btn">Hide Menu & Play</button>
    </div>

    <script>
        // --- Audio Setup ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playCoinSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(987.77, audioCtx.currentTime); 
            oscillator.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        // --- Game State ---
        let numSplits = 5;
        let partsData = []; 

        const availableColors = [
            { class: 'color-red', label: 'Red', textCol: '#ffffff' },
            { class: 'color-yellow', label: 'Yellow', textCol: '#000000' },
            { class: 'color-green', label: 'Green', textCol: '#ffffff' },
            { class: 'color-blue', label: 'Blue', textCol: '#ffffff' },
            { class: 'color-white', label: 'White', textCol: '#000000' }
        ];
        
        const pointOptions = [1, 2, 5, 10, 20, 50, 100];

        // --- DOM Elements ---
        const splitContainer = document.getElementById('split-container');
        const partsSelect = document.getElementById('parts-select');
        const layoutSelect = document.getElementById('layout-select');
        const dynamicSettings = document.getElementById('dynamic-settings');
        const resetBtn = document.getElementById('reset-btn');
        const hideUiBtn = document.getElementById('hide-ui-btn');
        const uiPanel = document.getElementById('ui-panel');

        // --- Core Functions ---

        function initData() {
            const oldData = [...partsData];
            partsData = [];
            for (let i = 0; i < numSplits; i++) {
                if (oldData[i]) {
                    partsData.push(oldData[i]);
                } else {
                    partsData.push({
                        id: i,
                        score: 0,
                        colorClass: availableColors[i % availableColors.length].class,
                        points: 5 
                    });
                }
            }
        }

        function buildSettings() {
            dynamicSettings.innerHTML = ''; 
            
            partsData.forEach((part, index) => {
                const group = document.createElement('div');
                group.classList.add('control-group');
                
                const label = document.createElement('label');
                label.textContent = `Team ${index + 1} Settings:`;
                group.appendChild(label);

                const row = document.createElement('div');
                row.classList.add('settings-row');

                const colorSelect = document.createElement('select');
                availableColors.forEach(color => {
                    const opt = document.createElement('option');
                    opt.value = color.class;
                    opt.textContent = color.label;
                    if (color.class === part.colorClass) opt.selected = true;
                    colorSelect.appendChild(opt);
                });
                
                colorSelect.addEventListener('change', (e) => {
                    part.colorClass = e.target.value;
                    renderGameView();
                });

                const pointsSelect = document.createElement('select');
                pointOptions.forEach(pts => {
                    const opt = document.createElement('option');
                    opt.value = pts;
                    opt.textContent = `${pts} Points`;
                    if (pts === part.points) opt.selected = true;
                    pointsSelect.appendChild(opt);
                });

                pointsSelect.addEventListener('change', (e) => {
                    part.points = parseInt(e.target.value);
                });

                row.appendChild(colorSelect);
                row.appendChild(pointsSelect);
                group.appendChild(row);
                dynamicSettings.appendChild(group);
            });
        }

        function renderGameView() {
            splitContainer.innerHTML = ''; 
            const ranked = [...partsData].sort((a, b) => b.score - a.score);

            partsData.forEach(part => {
                const div = document.createElement('div');
                div.classList.add('split-part', part.colorClass);
                div.dataset.id = part.id;
                div.textContent = part.score;
                
                const colorObj = availableColors.find(c => c.class === part.colorClass);
                div.style.color = colorObj ? colorObj.textCol : '#000';
                
                const rankIndex = ranked.findIndex(r => r.id === part.id);
                div.style.order = rankIndex;

                splitContainer.appendChild(div);
            });
        }

        // --- Event Listeners for UI ---
        
        layoutSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            splitContainer.classList.remove('force-col', 'force-row');
            if (val === 'horizontal') splitContainer.classList.add('force-row');
            if (val === 'vertical') splitContainer.classList.add('force-col');
        });

        partsSelect.addEventListener('change', (e) => {
            numSplits = parseInt(e.target.value);
            initData();
            buildSettings();
            renderGameView();
        });

        resetBtn.addEventListener('click', () => {
            partsData.forEach(part => part.score = 0);
            renderGameView();
        });

        hideUiBtn.addEventListener('click', () => {
            uiPanel.classList.add('hidden');
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        });

        // --- Universal Gesture Logic (Touch + Mouse) ---
        let startX = 0;
        let startY = 0;
        let lastTapTime = 0;

        function handleGestureStart(x, y) {
            startX = x;
            startY = y;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function handleGestureEnd(endX, endY, targetElement, e, isMouse = false) {
            const distanceX = Math.abs(endX - startX);
            const distanceY = Math.abs(endY - startY);
            const isSwipe = (distanceX > 30 || distanceY > 30);
            
            if (isSwipe) {
                // If dragged/swiped far enough, trigger score
                const targetPart = targetElement.closest('.split-part');
                if (targetPart && uiPanel.classList.contains('hidden')) {
                    const id = parseInt(targetPart.dataset.id);
                    const partData = partsData.find(p => p.id === id);
                    if (partData) {
                        partData.score += partData.points;
                        playCoinSound(); 
                        renderGameView(); 
                    }
                }
            } else if (!isMouse) {
                // Handle mobile double tap (Mouse double click is handled separately via 'dblclick')
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                
                if (tapLength < 300 && tapLength > 0) {
                    uiPanel.classList.remove('hidden');
                    if (e && e.preventDefault) e.preventDefault();
                }
                lastTapTime = currentTime;
            }
        }

        // 1. Touch Events (Mobile/Tablet)
        splitContainer.addEventListener('touchstart', (e) => {
            handleGestureStart(e.changedTouches[0].screenX, e.changedTouches[0].screenY);
        }, { passive: false });

        splitContainer.addEventListener('touchend', (e) => {
            handleGestureEnd(e.changedTouches[0].screenX, e.changedTouches[0].screenY, e.target, e, false);
        }, { passive: false });

        // 2. Mouse Events (Laptop/Desktop Trackpads and Mice)
        splitContainer.addEventListener('mousedown', (e) => {
            handleGestureStart(e.screenX, e.screenY);
        });

        splitContainer.addEventListener('mouseup', (e) => {
            handleGestureEnd(e.screenX, e.screenY, e.target, e, true);
        });

        // Dedicated double-click event for computer mice
        splitContainer.addEventListener('dblclick', () => {
            uiPanel.classList.remove('hidden');
        });

        // --- Boot Sequence ---
        initData();
        buildSettings();
        renderGameView();
    </script>
</body>
</html>
