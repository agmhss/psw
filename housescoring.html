<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Swipe Scoreboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        body, html {
            height: 100%;
            overflow: hidden; 
            background-color: #222;
            touch-action: pan-x pan-y; 
        }

        /* Top HUD Bar for Round and Timer */
        #top-hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 5;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 2px solid #555;
        }

        #timer-display {
            font-family: monospace;
            font-size: 1.4rem;
            color: #ffd700;
        }

        #timer-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            margin: 0;
            font-size: 1rem;
        }

        #timer-btn.running { background-color: #ff9800; }

        /* Container */
        #split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            cursor: pointer; 
        }

        @media screen and (orientation: portrait) {
            #split-container:not(.force-row) { flex-direction: column; }
        }
        @media screen and (orientation: landscape) {
            #split-container:not(.force-col) { flex-direction: row; }
        }

        #split-container.force-col { flex-direction: column !important; }
        #split-container.force-row { flex-direction: row !important; }

        .split-part {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem; 
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        /* Floating UI Panel */
        #ui-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            width: 95%;
            max-width: 500px;
            max-height: 95vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .hidden { display: none !important; }

        h2 {
            font-size: 1.6rem; 
            margin-bottom: 5px;
            color: #fff;
        }

        .subtitle {
            font-size: 0.9rem; color: #aaa; margin-bottom: 20px; display: block;
        }

        .control-group {
            margin-bottom: 15px;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
        }

        .settings-row {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.1rem; 
            font-weight: bold;
            color: #eee;
        }

        select, button {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem; 
            border-radius: 8px;
            border: none;
            outline: none;
            background-color: #fff;
            color: #333;
            cursor: pointer;
        }

        button {
            background-color: #2196f3;
            color: white;
            font-weight: bold;
            margin-top: 10px;
        }

        button:active { filter: brightness(0.9); }
        
        #next-round-btn { background-color: #9c27b0; }
        #hide-ui-btn { background-color: #ff4c4c; margin-top: 20px;}
        #reset-btn { background-color: #555; font-size: 0.9rem; padding: 10px;}

        /* Color classes */
        .color-red { background-color: #ff4c4c; }
        .color-yellow { background-color: #ffd700; }
        .color-green { background-color: #4caf50; }
        .color-blue { background-color: #2196f3; }
        .color-white { background-color: #ffffff; }

    </style>
</head>
<body>

    <div id="top-hud">
        <span id="round-display">Round 1</span>
        <span>|</span>
        <span id="timer-display">01:00</span>
        <button id="timer-btn">Start</button>
    </div>

    <div id="split-container"></div>

    <div id="ui-panel">
        <h2>Game Settings</h2>
        <span class="subtitle">(Double Tap screen to show this menu anytime)</span>

        <div class="control-group" style="border: 2px solid #9c27b0;">
            <label>Current Round Rules:</label>
            <div class="settings-row">
                <select id="global-points-select">
                    <option value="1">1 Point / Swipe</option>
                    <option value="2">2 Points / Swipe</option>
                    <option value="5" selected>5 Points / Swipe</option>
                    <option value="10">10 Points / Swipe</option>
                    <option value="20">20 Points / Swipe</option>
                    <option value="50">50 Points / Swipe</option>
                </select>
                <select id="timer-duration-select">
                    <option value="30">30 Sec Timer</option>
                    <option value="60" selected>1 Min Timer</option>
                    <option value="120">2 Min Timer</option>
                    <option value="300">5 Min Timer</option>
                </select>
            </div>
            <button id="next-round-btn">Carry Scores to Next Round</button>
        </div>

        <div class="control-group">
            <div class="settings-row">
                <div>
                    <label>Teams</label>
                    <select id="parts-select">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5" selected>5</option>
                    </select>
                </div>
                <div>
                    <label>Layout</label>
                    <select id="layout-select">
                        <option value="auto">Auto</option>
                        <option value="horizontal">Horizontal</option>
                        <option value="vertical">Vertical</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="dynamic-settings"></div>

        <button id="hide-ui-btn">Hide Menu & Play</button>
        <button id="reset-btn">Hard Reset (Score & Rounds to Zero)</button>
    </div>

    <script>
        // --- Audio Setup (Coin & Alarm) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playCoinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(987.77, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playAlarmSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let startTime = audioCtx.currentTime;
            
            // Play 4 harsh beeps
            for(let i=0; i<4; i++) { 
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, startTime + (i * 0.3));
                gain.gain.setValueAtTime(0, startTime + (i * 0.3));
                gain.gain.linearRampToValueAtTime(0.4, startTime + (i * 0.3) + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + (i * 0.3) + 0.25);
                osc.start(startTime + (i * 0.3));
                osc.stop(startTime + (i * 0.3) + 0.25);
            }
        }

        // --- Game State ---
        let numSplits = 5;
        let globalPoints = 5;
        let currentRound = 1;
        let partsData = []; 

        // Timer State
        let timerDuration = 60; 
        let timeRemaining = 60;
        let timerInterval = null;

        const availableColors = [
            { class: 'color-red', label: 'Red', textCol: '#ffffff' },
            { class: 'color-yellow', label: 'Yellow', textCol: '#000000' },
            { class: 'color-green', label: 'Green', textCol: '#ffffff' },
            { class: 'color-blue', label: 'Blue', textCol: '#ffffff' },
            { class: 'color-white', label: 'White', textCol: '#000000' }
        ];

        // --- DOM Elements ---
        const splitContainer = document.getElementById('split-container');
        const partsSelect = document.getElementById('parts-select');
        const layoutSelect = document.getElementById('layout-select');
        const globalPointsSelect = document.getElementById('global-points-select');
        const timerDurationSelect = document.getElementById('timer-duration-select');
        const dynamicSettings = document.getElementById('dynamic-settings');
        const resetBtn = document.getElementById('reset-btn');
        const nextRoundBtn = document.getElementById('next-round-btn');
        const hideUiBtn = document.getElementById('hide-ui-btn');
        const uiPanel = document.getElementById('ui-panel');
        
        // HUD Elements
        const roundDisplay = document.getElementById('round-display');
        const timerDisplay = document.getElementById('timer-display');
        const timerBtn = document.getElementById('timer-btn');

        // --- Core Functions ---

        function initData() {
            const oldData = [...partsData];
            partsData = [];
            for (let i = 0; i < numSplits; i++) {
                if (oldData[i]) {
                    partsData.push(oldData[i]);
                } else {
                    partsData.push({
                        id: i,
                        score: 0,
                        colorClass: availableColors[i % availableColors.length].class
                    });
                }
            }
        }

        function buildTeamSettings() {
            dynamicSettings.innerHTML = ''; 
            partsData.forEach((part, index) => {
                const group = document.createElement('div');
                group.classList.add('control-group');
                group.style.padding = '10px';
                group.style.marginBottom = '5px';
                
                const row = document.createElement('div');
                row.classList.add('settings-row');
                row.style.alignItems = 'center';

                const label = document.createElement('label');
                label.textContent = `Team ${index + 1}:`;
                label.style.margin = '0';
                label.style.width = '80px';

                const colorSelect = document.createElement('select');
                availableColors.forEach(color => {
                    const opt = document.createElement('option');
                    opt.value = color.class;
                    opt.textContent = color.label;
                    if (color.class === part.colorClass) opt.selected = true;
                    colorSelect.appendChild(opt);
                });
                
                colorSelect.addEventListener('change', (e) => {
                    part.colorClass = e.target.value;
                    renderGameView();
                });

                row.appendChild(label);
                row.appendChild(colorSelect);
                group.appendChild(row);
                dynamicSettings.appendChild(group);
            });
        }

        function renderGameView() {
            splitContainer.innerHTML = ''; 
            const ranked = [...partsData].sort((a, b) => b.score - a.score);

            partsData.forEach(part => {
                const div = document.createElement('div');
                div.classList.add('split-part', part.colorClass);
                div.dataset.id = part.id;
                div.textContent = part.score;
                
                const colorObj = availableColors.find(c => c.class === part.colorClass);
                div.style.color = colorObj ? colorObj.textCol : '#000';
                
                const rankIndex = ranked.findIndex(r => r.id === part.id);
                div.style.order = rankIndex;

                splitContainer.appendChild(div);
            });
            roundDisplay.textContent = `Round ${currentRound}/10`;
        }

        // --- Timer Functions ---
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerUI() {
            timerDisplay.textContent = formatTime(timeRemaining);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeRemaining = timerDuration;
            timerBtn.textContent = 'Start';
            timerBtn.classList.remove('running');
            updateTimerUI();
        }

        timerBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevents tapping the button from counting as a swipe
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (timerInterval) {
                // Pause it
                clearInterval(timerInterval);
                timerInterval = null;
                timerBtn.textContent = 'Resume';
                timerBtn.classList.remove('running');
            } else {
                // Start it
                if (timeRemaining === 0) resetTimer(); // Restart if it was at 0
                timerBtn.textContent = 'Pause';
                timerBtn.classList.add('running');
                
                timerInterval = setInterval(() => {
                    if (timeRemaining > 0) {
                        timeRemaining--;
                        updateTimerUI();
                    } else {
                        // Time's Up!
                        clearInterval(timerInterval);
                        timerInterval = null;
                        timerBtn.textContent = 'Done';
                        timerBtn.classList.remove('running');
                        playAlarmSound();
                    }
                }, 1000);
            }
        });

        // --- Event Listeners for UI Settings ---
        
        globalPointsSelect.addEventListener('change', (e) => { globalPoints = parseInt(e.target.value); });
        
        timerDurationSelect.addEventListener('change', (e) => { 
            timerDuration = parseInt(e.target.value); 
            resetTimer();
        });

        layoutSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            splitContainer.classList.remove('force-col', 'force-row');
            if (val === 'horizontal') splitContainer.classList.add('force-row');
            if (val === 'vertical') splitContainer.classList.add('force-col');
        });

        partsSelect.addEventListener('change', (e) => {
            numSplits = parseInt(e.target.value);
            initData();
            buildTeamSettings();
            renderGameView();
        });

        nextRoundBtn.addEventListener('click', () => {
            if (currentRound < 10) {
                currentRound++;
                resetTimer();
                renderGameView();
                alert(`Round ${currentRound} Ready!\nChange the Points or Timer if needed, then click "Hide Menu & Play".`);
            } else {
                alert("You have reached the maximum of 10 rounds!");
            }
        });

        resetBtn.addEventListener('click', () => {
            if(confirm("Are you sure? This will erase all scores and reset back to Round 1.")) {
                currentRound = 1;
                partsData.forEach(part => part.score = 0);
                resetTimer();
                renderGameView();
            }
        });

        hideUiBtn.addEventListener('click', () => {
            uiPanel.classList.add('hidden');
            if (audioCtx.state === 'suspended') audioCtx.resume();
        });

        // --- Universal Gesture Logic (Touch + Mouse) ---
        let startX = 0; let startY = 0; let lastTapTime = 0;

        function handleGestureStart(x, y) {
            startX = x; startY = y;
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function handleGestureEnd(endX, endY, targetElement, e, isMouse = false) {
            // Prevent swipe if user is interacting with the top HUD
            if (targetElement.closest('#top-hud')) return;

            const distanceX = Math.abs(endX - startX);
            const distanceY = Math.abs(endY - startY);
            const isSwipe = (distanceX > 30 || distanceY > 30);
            
            if (isSwipe) {
                const targetPart = targetElement.closest('.split-part');
                if (targetPart && uiPanel.classList.contains('hidden')) {
                    const id = parseInt(targetPart.dataset.id);
                    const partData = partsData.find(p => p.id === id);
                    if (partData) {
                        partData.score += globalPoints; // Use global points here
                        playCoinSound(); 
                        renderGameView(); 
                    }
                }
            } else if (!isMouse) {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                if (tapLength < 300 && tapLength > 0) {
                    uiPanel.classList.remove('hidden');
                    if (e && e.preventDefault) e.preventDefault();
                }
                lastTapTime = currentTime;
            }
        }

        // Mobile Events
        splitContainer.addEventListener('touchstart', (e) => {
            handleGestureStart(e.changedTouches[0].screenX, e.changedTouches[0].screenY);
        }, { passive: false });

        splitContainer.addEventListener('touchend', (e) => {
            handleGestureEnd(e.changedTouches[0].screenX, e.changedTouches[0].screenY, e.target, e, false);
        }, { passive: false });

        // Laptop Events
        splitContainer.addEventListener('mousedown', (e) => {
            handleGestureStart(e.screenX, e.screenY);
        });

        splitContainer.addEventListener('mouseup', (e) => {
            handleGestureEnd(e.screenX, e.screenY, e.target, e, true);
        });

        splitContainer.addEventListener('dblclick', () => {
            uiPanel.classList.remove('hidden');
        });

        // --- Boot Sequence ---
        globalPoints = parseInt(globalPointsSelect.value);
        timerDuration = parseInt(timerDurationSelect.value);
        initData();
        buildTeamSettings();
        resetTimer();
        renderGameView();
    </script>
</body>
</html>
